<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoring Pre-FS NTT</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: ruang kendali proyek yang ramah — sekali lihat tahu posisi pekerjaan
   IDEA: peta laut pulau-pulau selatan NTT; kapal BBM dari Kupang, matahari di atas Laut Sawu
   PICTURE: peta skematik Rote, Ndao, Sabu, Raijua dengan jalur kapal bergerak, jadi pintu ke tiap sistem
   COLOUR and TYPE: laut teal, pulau pasir, jingga matahari; Sofia Sans Condensed 800 + Instrument Sans
   LAYOUT: satu layar tanpa gulir — bilah atas (proyek + menu), lalu panel-panel yang mengisi tinggi layar */
:root{color-scheme:light dark;--bg:light-dark(#f4f2ea,#0a1618);--card:light-dark(#fff,#11242a);--ink:light-dark(#122a30,#e8f1ef);--mute:light-dark(#5b7075,#94aaab);--line:light-dark(#dde2da,#22393f);--soft:light-dark(#eef0e8,#172e34);--sea:light-dark(#0f6577,#0b3d49);--sea2:light-dark(#0c5566,#093540);--land:light-dark(#f6e7b4,#e6d6a0);--acc:#ff5a1f;--acc2:light-dark(#c63c0a,#ff8a5c);--ok:light-dark(#178f64,#3ccf97);--sun:#ffc53d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden}
h1,h2,h3,.num{font-family:"Sofia Sans Condensed","Arial Narrow",sans-serif;font-weight:800;line-height:1.05;margin:0}
h2{font-size:22px}h3{font-size:19px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:24px;white-space:nowrap}
.logo{width:34px;height:34px;flex:none}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:3px}
.seg a{padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--mute);font-weight:600;white-space:nowrap}
.seg a[aria-current]{background:var(--sea);color:#fff}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;text-decoration:none;color:var(--mute);font-weight:600}
nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
nav a[aria-current]{background:var(--ink);color:var(--card)}
nav a:hover:not([aria-current]),.seg a:hover:not([aria-current]){color:var(--ink)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--ok);animation:blink 2.4s infinite}
main{padding:12px;min-height:0;display:grid}
.view{display:grid;gap:12px;min-height:0;height:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:0;overflow:auto;scrollbar-width:thin}
.col{display:grid;gap:12px;min-height:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mute{color:var(--mute);font-size:13px}.late{color:var(--acc2);font-weight:600}
/* peta */
.v-peta{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.v-peta .l{grid-template-rows:minmax(0,1fr) auto}
.mapcard{padding:0;overflow:hidden!important;background:var(--sea);border-color:var(--sea2);container-type:size;display:grid;place-items:center;min-height:170px}
.map{position:relative;width:min(100cqw,100cqh*2.154);aspect-ratio:840/390}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.land{fill:var(--land);stroke:var(--land);stroke-width:6;stroke-linejoin:round}.dim{opacity:.45}
.timor{fill:color-mix(in srgb,var(--land) 55%,var(--sea));stroke:none}
.route{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round;opacity:.75;animation:dash 1.6s linear infinite}
.route.s{stroke-width:1.5;opacity:.5}
.pulse{fill:none;stroke:var(--acc);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.wave{fill:none;stroke:#fff;opacity:.13;stroke-width:2;stroke-linecap:round}
.chip{position:absolute;transform:translate(-50%,-50%);border:2px solid transparent;background:var(--card);color:var(--ink);border-radius:12px;padding:.3em .7em;font:inherit;font-size:clamp(10px,1.75cqw,13px);line-height:1.2;cursor:pointer;text-align:left;box-shadow:0 3px 10px rgb(0 0 0/.25);white-space:nowrap}
.chip b{display:block;font:800 1.3em/1 "Sofia Sans Condensed",sans-serif}.chip.on{border-color:var(--acc)}.chip.off{opacity:.7}
.mlab{position:absolute;transform:translate(-50%,-50%);color:#fff;font-size:12px;opacity:.8;white-space:nowrap;pointer-events:none}.mlab.i{font-style:italic;opacity:.55;font-size:14px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ring{position:relative;text-align:center;font-size:13px;color:var(--mute)}.ring svg{width:76px;height:76px;transform:rotate(-90deg);display:block;margin:0 auto}
.ring b{position:absolute;left:0;right:0;top:0;height:76px;line-height:76px;font:800 22px/76px "Sofia Sans Condensed",sans-serif;color:var(--ink)}
.rt{fill:none;stroke:var(--soft);stroke-width:8}.rv{fill:none;stroke-width:8;stroke-linecap:round}
.next{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--card);border-radius:12px;padding:9px 12px;margin-top:10px}
.next .num{font-size:26px;color:var(--sun);flex:none}.next small{display:block;opacity:.75;font-size:12px}
.up{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:6px 14px}
.up li{display:flex;gap:8px;align-items:baseline;font-size:14px}.up i{font-style:normal;flex:none;font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--soft);white-space:nowrap}.up i.late{background:var(--acc);color:#fff}
/* sistem */
.tag{font:600 12px/1 "Instrument Sans",sans-serif;padding:5px 8px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.meter div{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.meter s,.dn s{display:block;height:12px;border-radius:99px;background:var(--sea);text-decoration:none;transform-origin:left}.meter s.pk{background:var(--acc)}.meter s.n1{opacity:.4}
.meter em,.dn em{font-style:normal;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.dn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 8px;align-items:center;font-size:13px;margin:10px 0;padding:10px;border-radius:12px;background:var(--soft)}
.dn svg{width:20px;height:20px}.dn s.d{background:var(--sun)}.dn s.n{background:var(--ink)}
.facts{display:grid;grid-template-columns:minmax(0,6.5em) minmax(0,1fr);gap:3px 10px;margin:10px 0 0;font-size:13.5px}.facts dt{color:var(--mute)}.facts dd{margin:0}
.warn{font-size:13px;margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent);border-radius:0 8px 8px 0}
.v-sistem{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:12.5px}.opt .ring svg{width:64px;height:64px}.opt .ring b{height:64px;line-height:64px;font-size:19px}
.opt p{margin:4px 0 0}.opt strong{display:block;font-size:13.5px}
.steps{display:grid;gap:8px;margin-top:12px;counter-reset:s}
.steps div{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--soft);font-size:14px}
.steps div::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-weight:700}
/* jadwal */
.v-jadwal{grid-template-rows:minmax(0,1fr) auto}
.v-jadwal>.card{display:grid;grid-template-rows:auto minmax(0,1fr)}.gantt{--lab:270px;position:relative;display:grid;grid-auto-rows:minmax(26px,46px);align-content:space-evenly}
.grow{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);gap:10px;align-items:center}
.grow .lab{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{position:relative;height:100%}
.bar{position:absolute;top:calc(50% - 7px);height:14px;border-radius:99px;background:var(--sea);transform-origin:left}.bar.past{background:var(--ok)}.bar.fgd{background:var(--sun)}
.months{position:relative;height:20px;font-size:12px;color:var(--mute)}.months span{position:absolute}
.gl{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.gov{position:absolute;top:20px;bottom:0;left:calc(var(--lab) + 10px);right:0;pointer-events:none}
.today{position:absolute;top:0;bottom:26px;border-left:2px solid var(--acc)}.today b{position:absolute;top:-19px;left:-26px;font-size:11px;background:var(--acc);color:#fff;padding:1px 6px;border-radius:99px;white-space:nowrap}
.ms{position:absolute;bottom:0;transform:translateX(-50%);font:800 13px/1 "Sofia Sans Condensed",sans-serif;background:var(--ink);color:var(--card);padding:4px 7px;border-radius:6px}.ms.done{background:var(--ok);color:#fff}
.dels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.del{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);display:grid;gap:5px;font-size:13px}
.del .num{font-size:26px}.del.selesai{border-color:var(--ok)}.del.selesai .num{color:var(--ok)}.del.cur{border-color:var(--acc)}.del.cur .num{color:var(--acc)}
/* kanban */
.v-kerja,.v-data,.v-catatan{grid-template-rows:auto minmax(0,1fr)}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{min-height:36px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-weight:600}
.fchip[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:0}
.kcol{background:var(--soft);border-radius:16px;padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.kcol h3{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 8px}.kcol h3 span{font:600 13px "Instrument Sans",sans-serif;background:var(--card);border-radius:99px;padding:2px 9px}
.klist{overflow:auto;display:grid;gap:8px;align-content:start;scrollbar-width:thin}
.kc{background:var(--card);border-radius:12px;padding:9px 10px;border:1px solid var(--line);border-left:4px solid var(--line);display:grid;gap:6px}
.kc.jalan{border-left-color:var(--acc)}.kc.blok{border-left-color:var(--acc);background:repeating-linear-gradient(135deg,var(--card) 0 8px,color-mix(in srgb,var(--acc) 9%,var(--card)) 8px 16px)}.kc.selesai{border-left-color:var(--ok);opacity:.8}
.kt{all:unset;cursor:pointer;font-size:14px;line-height:1.3;font-weight:500}.kt:hover{text-decoration:underline}
.km{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.av{width:22px;height:22px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.go{margin-left:auto;min-height:30px;padding:0 11px;border-radius:99px;border:0;background:var(--ink);color:var(--card);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}.go.ok{background:var(--ok);color:#fff}
/* data */
.v-data .body{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:12px;min-height:0}
.donut{position:relative;width:160px;margin:4px auto 10px}.donut svg{transform:rotate(-90deg);display:block}.donut b{position:absolute;inset:0;display:grid;place-items:center;font:800 34px "Sofia Sans Condensed",sans-serif}
.leg{display:grid;gap:5px;font-size:13.5px}.leg span{display:flex;align-items:center;gap:8px}.leg i{width:12px;height:12px;border-radius:4px;flex:none}.leg em{margin-left:auto;font-style:normal;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px;align-content:start}
.tile{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:9px 10px;display:grid;gap:6px;align-content:space-between}
.tile.selesai{border-left-color:var(--ok)}.tile.part{border-left-color:var(--sun)}.tile.jalan{border-left-color:var(--acc)}.tile.blok{border-left-color:var(--ink)}
select.st{min-height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 6px;font:inherit;font-size:13px;font-weight:600;max-width:100%}
/* catatan */
.v-catatan{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-rows:minmax(0,1fr)}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.log{list-style:none;margin:0;padding:0}.log li{padding:10px 0;border-bottom:1px solid var(--line)}
.btn{color:var(--ink);min-height:40px;padding:0 15px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);cursor:pointer;font:inherit;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ghost{border-color:var(--line)}.btn:disabled,.go:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mute);text-align:center;font-size:14px}
.banner{position:fixed;left:12px;bottom:12px;max-width:420px;background:var(--ink);color:var(--card);padding:10px 14px;border-radius:12px;font-size:13.5px;z-index:5}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.modal.open{display:flex}
.dlg{background:var(--card);border-radius:16px;padding:20px;width:min(540px,100%);max-height:92vh;overflow:auto}
.dlg label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.dlg input,.dlg select,.dlg textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.acts{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}.toast.on{opacity:1}
@keyframes dash{to{stroke-dashoffset:-24}}@keyframes pulse{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.4}}
@keyframes grow{from{transform:scaleX(0)}}@keyframes ringin{from{stroke-dasharray:0 999}}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.anim .view{animation:fade .35s ease-out}.anim .rv{animation:ringin .9s ease-out}.anim .bar,.anim .meter s,.anim .dn s{animation:grow .7s ease-out backwards}.anim .kc,.anim .tile{animation:fade .35s ease-out backwards}
@media(prefers-reduced-motion:reduce){*,.anim *{animation:none!important}}
@media(max-width:680px),(max-height:520px){html,body{height:auto}body{display:block;height:auto;overflow:auto}.view{height:auto;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:none!important}.card,.klist{overflow:visible}.mapcard{aspect-ratio:840/390;min-height:0}.kb,.dels,.v-data .body{grid-template-columns:minmax(0,1fr)}.gantt{--lab:120px}.chip{font-size:10px}nav{margin-left:0;width:100%}.brand h1{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="var(--sea)"/><circle cx="17" cy="14" r="6" fill="var(--sun)"/><path d="M4 22q4-4 8 0t8 0 10 0v12H4z" fill="var(--land)"/></svg><h1>Monitoring Pre-FS NTT</h1></div>
  <div class="seg" id="seg" aria-label="Proyek"></div>
  <nav id="nav" aria-label="Menu"></nav>
  <span class="sync"><i class="dot" id="dot"></i><span id="sync">Menyambung…</span></span>
</header>
<main id="app"></main>
<div id="ban"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <form class="dlg" id="form">
    <h3 id="mt">Ubah item</h3>
    <label for="f-title">Judul</label><input id="f-title" required>
    <div class="row2">
      <div><label for="f-sys">Sistem</label><select id="f-sys"></select></div>
      <div><label for="f-st">Status</label><select id="f-st"></select></div>
      <div><label for="f-pic">PIC</label><input id="f-pic" list="pics" placeholder="mis. Chaizar"></div>
      <div><label for="f-due">Tenggat</label><input id="f-due" type="date"></div>
    </div>
    <label for="f-note">Catatan</label><textarea id="f-note" style="min-height:70px" placeholder="Progres, kendala, tautan dokumen…"></textarea>
    <div class="acts"><button type="button" class="btn ghost" id="f-del">Hapus</button>
      <span style="display:flex;gap:10px"><button type="button" class="btn ghost" id="f-cancel">Batal</button><button type="submit" class="btn pri">Simpan</button></span></div>
  </form>
</div>
<datalist id="pics"><option>Qashtalani</option><option>Chaizar</option><option>Rizky</option><option>Ario</option><option>Ardafillah</option><option>IESR</option><option>PLN</option></datalist>
<div class="toast" id="toast" role="status"></div>

const M=$('#modal');
function openEdit(id,kind){const {p}=route(),i=id?S.items.find(x=>x.id===id):{kind,sys:S.filt,status:'todo',proj:p};if(!i)return;S.edit={id,proj:i.proj,kind:i.kind};
 $('#mt').textContent=(id?'Ubah ':'Tambah ')+(i.kind==='data'?'permintaan data':'pekerjaan');
 $('#f-title').value=i.title||'';$('#f-pic').value=i.pic||'';$('#f-due').value=i.due||'';$('#f-note').value=i.note||'';
 $('#f-sys').innerHTML=['Semua',...P[i.proj].systems.map(s=>s.n)].map(s=>`<option${s===i.sys?' selected':''}>${s}</option>`).join('');
 $('#f-st').innerHTML=K[i.kind].map(([a,b])=>`<option value="${a}"${a===i.status?' selected':''}>${b}</option>`).join('');
 const d=$('#f-del');d.hidden=!id;d.textContent='Hapus';d.dataset.arm='';M.classList.add('open');$('#f-title').focus()}
function close(){M.classList.remove('open');S.edit=null}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const {p}=route();
 if(t.dataset.ed){if(!S.ro&&S.db)openEdit(t.dataset.ed)}
 else if(t.dataset.add)openEdit(null,t.dataset.add);
 else if(t.dataset.go){const [id,st]=t.dataset.go.split('|');save(id,{status:st})}
 else if(t.dataset.f){S.filt=t.dataset.f;render()}
 else if(t.dataset.isl){const [k,n]=t.dataset.isl.split('|');S.sel[k]=n;if(k!==p)location.hash=k+'-peta';else render()}
 else if(t.dataset.log)addLog(t.dataset.log);
 else if(t.dataset.copy)copySum(t.dataset.copy)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.st){const i=S.items.find(x=>x.id===t.dataset.st);if(i&&i.status!==t.value)save(i.id,{status:t.value})}});
document.addEventListener('input',e=>{if(e.target.id==='logtxt')S.draft[route().p]=e.target.value});
$('#f-cancel').onclick=close;M.addEventListener('click',e=>{if(e.target===M)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M.classList.contains('open'))close()});
$('#f-del').onclick=async()=>{const b=$('#f-del');if(!b.dataset.arm){b.dataset.arm='1';b.textContent='Klik lagi untuk hapus';return}
 const id=S.edit?.id;close();try{await S.db.collection('items').doc(id).delete();toast('Item dihapus')}catch(e){fail(e)}};
$('#form').addEventListener('submit',async e=>{e.preventDefault();if(!S.db||!S.edit)return;
 const d={title:$('#f-title').value.trim(),sys:$('#f-sys').value,pic:$('#f-pic').value.trim(),due:$('#f-due').value,status:$('#f-st').value,note:$('#f-note').value.trim()};
 if(!d.title)return;const {id,proj,kind}=S.edit;close();
 if(id)await save(id,d);else{try{await S.db.collection('items').doc().set({...d,kind,proj,order:Date.now(),updatedAt:Date.now(),updatedBy:S.me||''});toast('Item ditambahkan')}catch(er){fail(er)}}});
async function addLog(p){const txt=(S.draft[p]||'').trim();if(!txt||!S.db)return;
 try{await S.db.collection('log').add({proj:p,text:txt,by:S.me||'',at:Date.now()});S.draft[p]='';render();toast('Catatan disimpan')}catch(e){fail(e)}}
async function copySum(p){const X=P[p],s=stats(p),T=its(p,'task'),l=[`Laporan kemajuan Pre-FS ${X.name} (RFP ${X.code}), ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}`,'',`Pekerjaan selesai: ${s.pct}% (${s.done}/${s.tot})`,`Data diterima: ${s.rec}/${s.dtot}`,'','Laporan:'];
 its(p,'deliv').forEach(i=>l.push(`- ${i.code} ${i.title}: ${lab('deliv',i.status)} (tenggat ${fd(i.due)})`));
 l.push('','Selesai:');T.filter(i=>i.status==='selesai').forEach(i=>l.push('- '+i.title));
 l.push('','Berjalan / terhambat:');T.filter(i=>i.status==='jalan'||i.status==='blok').forEach(i=>l.push(`- ${i.title} (${lab('task',i.status)})${i.note?': '+i.note:''}`));
 l.push('','Data masih ditunggu:');its(p,'data').filter(i=>i.status!=='selesai').forEach(i=>l.push(`- ${i.title}: ${lab('data',i.status)}`));
 try{await navigator.clipboard.writeText(l.join('\n'));toast('Ringkasan disalin')}catch(e){toast('Browser menolak menyalin')}}

window.addEventListener('hashchange',()=>render(true));
render(true);
(async()=>{let db=null,user=null;try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
 S.tried=true;S.db=db;S.user=user;
 if(user){try{S.me=await user.id()}catch(e){}try{if((await user.can('data.write'))===false)S.ro=true}catch(e){}}
 if(!db){$('#sync').textContent='Tidak terhubung';render();return}
 const timer=setTimeout(()=>{S.slow=true;$('#sync').textContent='Belum terjangkau';render()},10000);
 const err=()=>{clearTimeout(timer);$('#sync').textContent='Sinkron terputus';render()};
 S.u1=db.collection('items').onSnapshot(snap=>{S.items=snap.docs.map(d=>({id:d.id,...d.data()}));let first=false;
  if(!snap.metadata.fromCache&&!S.live){clearTimeout(timer);S.live=true;S.slow=false;first=true;$('#dot').classList.add('on');$('#sync').textContent='Tersinkron'}render(first)},err);
 S.u2=db.collection('log').orderBy('at','desc').limit(200).onSnapshot(snap=>{S.logs=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err);
 render()})();
}
</script>
</body>
</html>
